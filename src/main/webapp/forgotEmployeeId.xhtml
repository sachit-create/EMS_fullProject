<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html">
	<h:head>
		<title>Recover Employee ID</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</h:head>
	<h:body class="bg-white min-h-screen flex items-center justify-center p-4">
		<h:form class="border-2 border-green-400 rounded-[30px] md:rounded-[36px] p-6 md:p-10 flex flex-col gap-5 w-full max-w-[420px] shadow-md bg-white">
			<h2 class="text-green-600 text-2xl md:text-3xl font-bold text-center">Recover ID</h2>
			<p class="text-gray-600 text-center text-sm md:text-base">Enter the email address used for the employee record.</p>

			<p:messages id="recoveryMessages" showDetail="true" closable="true" />

			<p:inputText id="email" value="#{employeeIdRecovery.email}" placeholder="Employee Email"
				styleClass="shadow-none text-black w-full rounded-2xl border-black border-[1px] outline-none focus:shadow-none focus:outline-none  transition-transform duration-300
                       hover:scale-[1.01] hover:shadow-xl px-5 py-4" />

			<p:commandButton value="Send ID to Inbox" action="#{employeeIdRecovery.sendEmployeeId}"
				update="@form" ajax="false"
				style="background:#4ade80;color:black;border:2px solid black;"
				styleClass="rounded-2xl py-3 font-bold" />

			<h:link outcome="loginPage" value="Back to login" styleClass="text-center text-green-600 font-medium" />
		</h:form>
	</h:body>
</f:view>
</html>
