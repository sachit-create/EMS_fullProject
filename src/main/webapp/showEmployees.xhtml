<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">

<f:metadata>
	<f:event type="preRenderView"
		listener="#{loginBean.ensureAdminLoggedIn}" />
</f:metadata>

<f:view contentType="text/html">
	<h:head>
		<title>Show Employees</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
.ui-widget-header, .ui-paginator, .ui-paginator-top,
	.ui-datatable-header {
	background: white !important;
	background-image: none !important;
	border: none !important;
	box-shadow: none !important;
}

.ui-datatable {
	border: none !important;
}

.ui-datatable table {
	width: 100% !important;
	table-layout: auto !important;
	border-collapse: collapse !important;
}

.ui-datatable th {
	background: #4ade80 !important;
	color: black !important;
	text-align: center !important;
	padding: 14px !important;
}

.ui-datatable td {
	text-align: center !important;
	padding: 12px !important;
}

.ui-datatable tbody tr:nth-child(odd) {
	background: white !important;
}

.ui-datatable tbody tr:nth-child(even) {
	background: #f3f4f6 !important;
}
</style>
	</h:head>
	<h:body class="bg-white min-h-screen overflow-auto p-4 md:p-6">
		<div class="min-h-full flex flex-col gap-6">
			<div
				class="border-2 border-green-400 rounded-3xl md:rounded-full bg-white shadow-lg px-6 md:px-8 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
				<div class="text-xl md:text-2xl font-semibold text-green-600">Hello,
					#{loginBean.displayName}</div>
				<div
					class="flex flex-wrap justify-center items-center gap-4 md:gap-8 text-base md:text-lg">
					<h:link outcome="dashboard" value="Dashboard"
						styleClass="hover:text-green-600 transition-colors" />
					<h:link outcome="showEmployees" value="Show Employees"
						styleClass="hover:text-green-600 transition-colors" />
					<h:link outcome="addemp" value="Add Employee"
						styleClass="hover:text-green-600 transition-colors" />
					<h:form prependId="false">
						<p:commandButton value="Logout" action="#{loginBean.logout}"
							ajax="false" process="@this"
							style="background:#4ade80;color:black;border:2px solid black;"
							styleClass="rounded-full px-5 py-2 transition-transform duration-300 hover:scale-105" />
					</h:form>
				</div>
			</div>

			<div class="flex-1 mt-6 min-h-0">
				<h:form styleClass="h-full">
					<div
						class="h-full w-full border-2 border-green-400 rounded-[30px] md:rounded-[40px] shadow-xl bg-white p-6 md:p-10 flex flex-col">
						<div
							class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
							<div>
								<h1 class="text-2xl md:text-3xl font-light">Employee
									Register</h1>
								<p class="text-gray-500">Total Employees:
									#{employeeView.employeeCount}</p>
							</div>
							<p:commandButton value="Refresh" action="#{employeeView.refresh}"
								update="@form" process="@this"
								style="background:#4ade80;color:black;border:2px solid black;"
								styleClass="rounded-full px-6 py-2" />
						</div>

						<p:messages id="listMessages" showDetail="true" closable="true" />

						<div
							class="flex-1 overflow-x-auto rounded-2xl border border-gray-200">
							<p:dataTable id="employeeTable" value="#{employeeView.employees}"
								var="employee" paginator="true" paginatorPosition="bottom"
								rows="10" emptyMessage="No employees found." styleClass="w-full"
								style="min-width: 1000px;">

								<p:column headerText="ID">
									<h:outputText value="#{employee.id}" />
								</p:column>
								<p:column headerText="Employee Code">
									<h:outputText value="#{employee.employeeCode}" />
								</p:column>
								<p:column headerText="Photo">
									<h:graphicImage value="#{employee.photoDataUri}"
										styleClass="h-12 w-12 rounded-full object-cover border border-gray-200" />
								</p:column>
								<p:column headerText="Name">
									<h:outputText value="#{employee.name}" />
								</p:column>
								<p:column headerText="Father Name">
									<h:outputText value="#{employee.fatherName}" />
								</p:column>
								<p:column headerText="Email">
									<h:outputText value="#{employee.email}" />
								</p:column>
								<p:column headerText="Gender">
									<h:outputText value="#{employee.genderLabel}" />
								</p:column>
								<p:column headerText="Salary">
									<h:outputText value="#{employee.salary}">
										<f:convertNumber type="currency" currencySymbol="₹" />
									</h:outputText>
								</p:column>
								<p:column headerText="Actions" styleClass="w-40 text-center">
									<div class="flex items-center justify-center gap-2">
										<h:link outcome="employeeAdminProfile" value="View"
											styleClass="bg-green-500 hover:bg-green-600 text-white text-xs font-semibold px-2.5 py-1 rounded transition-colors duration-200 no-underline inline-block">
											<f:param name="code" value="#{employee.employeeCode}" />
										</h:link>

										<h:link outcome="employeeAdminProfile" value="Update"
											styleClass="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-2.5 py-1 rounded transition-colors duration-200 no-underline inline-block">
											<f:param name="code" value="#{employee.employeeCode}" />
										</h:link>
									</div>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</h:form>
			</div>
		</div>
	</h:body>
</f:view>
</html>
